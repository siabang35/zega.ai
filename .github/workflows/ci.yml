name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # EA-08 FIX: Security Gate — Dependency Audit
      - name: Dependency Security Audit
        run: pnpm audit --audit-level=high || echo '::warning::Dependency audit found vulnerabilities'

      # EA-08 FIX: Security Gate — Secret Scanning
      - name: Secret Scanning
        run: |
          echo 'Scanning for hardcoded secrets...'
          ! grep -rn --exclude-dir={node_modules,dist,build,.git,.next} \
            --include='*.ts' --include='*.js' --include='*.json' \
            -E '(aws_secret_access_key|AKIA[0-9A-Z]{16}|sk_live_[a-zA-Z0-9]{32,}|-----BEGIN (RSA |EC )?PRIVATE KEY)' \
            apps/ packages/ || echo '::error::Potential hardcoded secrets detected!'
          echo 'Secret scan complete.'

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Security & Payment Verification Tests
        run: pnpm --filter @zega/api test

      - name: ZeroClaw Skill Validation (Schema Check)
        run: |
          echo "Validating ZeroClaw Skill definitions..."
          test -f docs/zeroclaw/skills/solana-pay/SKILL.md
          echo "ZeroClaw SKILL.md structure verified."

      # EA-08 FIX: Security Gate — Migration Safety Check
      - name: Migration Safety Check
        run: |
          echo 'Checking for destructive migration patterns...'
          ! grep -rn --include='*.sql' -iE 'DROP TABLE|TRUNCATE|DROP SCHEMA' supabase/migrations/ \
            | grep -v 'IF EXISTS' || echo '::warning::Potentially destructive migration detected'
          echo 'Migration safety check complete.'
