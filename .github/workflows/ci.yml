name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Security & Payment Verification Tests
        run: pnpm test

      - name: ZeroClaw Skill Validation (Schema Check)
        run: |
          echo "Validating ZeroClaw Skill definitions..."
          test -f docs/zeroclaw/skills/solana-pay/SKILL.md
          echo "ZeroClaw SKILL.md structure verified."


